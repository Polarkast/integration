name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: conformance-linux-x86_64, exe: conformance }
          - { os: macos-latest, target: aarch64-apple-darwin, name: conformance-macos-arm64, exe: conformance }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: conformance-windows-x86_64.exe, exe: conformance.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release -p conformance --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.exe }} --help
      - name: Stage
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.exe }} ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Rolling release
        run: |
          gh release view conformance-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create conformance-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                 --title "Conformance CLI (latest)" --notes "Rolling build of the conformance CLI from main."
          gh release upload conformance-latest dist/* --repo "$GITHUB_REPOSITORY" --clobber
