      summary: Open a game session from a launch token
      description: |
        `launch_token` is the `t` query parameter of the `game_url` returned by `/v1/launch`. It works once, within 5
        minutes. Unsigned. Polarkast reads the player's balance from the operator's `/wallet/balance` (a fun session
        has its play-money balance instead). The optional `device` is recorded on the session; operators never send
        it, the game client does. The response carries the launch's `lobby_url` (the target of the game's home button)
        and the currency's `currency_symbol` when Polarkast has configured one.
        For a hold-and-win or pay-anywhere game it also carries what the client needs to draw the game without its
        engine: the display model (`game`), the play amounts this session may use (`bets`), the opening play amount
        (`bet`) and the operator's `stake_limits`, which apply to the amount a round debits; a hold-and-win game also
        carries the pots at the opening play amount (`pots`, warm-started if the player has never used it, see Games).
        A bought or ante round is possible at a play amount whose cost is at most `stake_limits.max`, and an ante round
        only where its cost is a whole number of minor units (see Games).
        A money session also carries `rewards`: the player's rewards this session can play now (see Free rounds).
