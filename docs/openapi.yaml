        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/InternalError' }
  /v1/rewards:
    post:
      tags: [studio]
      operationId: createReward
      summary: Give a player free rounds
      description: |
        Requires `X-Operator-Id` and `X-Signature`, verified before the body is parsed. Creates a reward (see Free
        rounds), idempotent on `reward_id` (see Idempotency). Makes no wallet call: no money moves until a free round
        has been played. A repeat of a reward that exists returns it even if a setting has changed since. A new
        reward is refused, and nothing is created, when:
        - the operator is suspended (`OPERATOR_SUSPENDED`);
        - a game is not enabled for the operator or is switched off, or the currency and precision are not enabled
          for it (`NOT_AVAILABLE`);
        - a game is unknown or has no `freebet_support`, the `bet` is not a valid stake for every game (see Free
          rounds), or `expires_at` is not in the future or is more than 366 days ahead (`INVALID_REQUEST`).
      parameters:
        - name: X-Operator-Id
          in: header
          required: true
          description: Operator identifier issued by Polarkast. Selects the shared secret used to verify `X-Signature`.
          schema: { type: string }
          example: op_demo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RewardRequest' }
            examples:
              ok:
                value:
                  reward_id: welcome-42
                  player_id: player-42
                  currency: EUR
                  precision: 2
                  game_ids: [stub]
                  rounds: 10
                  bet: 100
                  expires_at: '2026-12-31T23:59:59Z'
      responses:
        '200':
          description: The reward, created now or earlier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reward' }
              examples:
                ok:
                  value:
                    reward_id: welcome-42
                    player_id: player-42
                    currency: EUR
                    precision: 2
                    game_ids: [stub]
                    rounds: 10
                    bet: 100
                    expires_at: '2026-12-31T23:59:59.000Z'
                    status: active
                    rounds_used: 0
                    win: 0
                    created_at: '2026-12-01T09:00:00.000Z'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSignature' }
        '403': { $ref: '#/components/responses/RewardForbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/InternalError' }
  /v1/rewards/cancel:
    post:
      tags: [studio]
      operationId: cancelReward
      summary: Cancel a reward before its first free round
      description: |
        Requires `X-Operator-Id` and `X-Signature`, verified before the body is parsed. Cancels the reward: no free
        round can start from it afterwards. Only before its first free round has started; after that it is
        `INVALID_REQUEST` and the reward is unchanged. Cancelling a cancelled reward returns it as it is. An unknown
        `reward_id`, or one of another operator, is `INVALID_REQUEST`. Works while the operator is suspended. Makes no
        wallet call. The response is the reward as it stands.
      parameters:
        - name: X-Operator-Id
          in: header
          required: true
          description: Operator identifier issued by Polarkast. Selects the shared secret used to verify `X-Signature`.
          schema: { type: string }
          example: op_demo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RewardCancelRequest' }
            examples:
              ok: { value: { reward_id: welcome-42 } }
      responses:
        '200':
          description: The reward, cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reward' }
              examples:
                ok:
                  value:
                    reward_id: welcome-42
                    player_id: player-42
                    currency: EUR
                    precision: 2
                    game_ids: [stub]
                    rounds: 10
                    bet: 100
                    expires_at: '2026-12-31T23:59:59.000Z'
                    status: cancelled
                    rounds_used: 0
                    win: 0
                    created_at: '2026-12-01T09:00:00.000Z'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSignature' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/InternalError' }
