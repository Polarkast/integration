        Returns the session player's pots at `bet`, a play amount from the session's `bets`. A play amount the player
        has never used gets its warm start now (see Games), drawn and stored once, so asking again returns the same
        pots. Moves no money. Unsigned. A `bet` not in `bets`, or a session of a game that is not hold-and-win, is
        `INVALID_REQUEST`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GamePotsRequest' }
            examples:
              ok: { value: { game_session_id: 2c7d1e90-6a3b-4f58-8e21-9d0c4b7a5f13, bet: 200 } }
