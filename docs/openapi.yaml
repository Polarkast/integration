  /v1/games:
    get:
      tags: [studio]
      operationId: games
      summary: The game catalog for this operator
      description: |
        Called by the operator to import Polarkast's games and keep them in sync, for example once a day. Requires
        `X-Operator-Id` and `X-Signature`, the HMAC of the empty body (see Signing). Moves no money; safe to repeat.
        Lists every game Polarkast offers that has an RTP, whether or not it is enabled for this operator, ordered by
        `game_id`. Each RTP variant of a game is its own `game_id` with its own `rtp`. The RTP comes from the game's
        math, the same source its certification uses: a weighted game's from its outcome table, a hold-and-win or
        pay-anywhere game's from the verified simulation of each mode. A game without an RTP is not listed.
        `enabled` says whether this operator can launch the game now. `stakes` has one entry per currency enabled for
        the operator, with the limits `/v1/launch` and `/game/round` apply; a reward's `bet` must be valid in them (see
        Free rounds). A game being retired has an `end_date` while it is still listed.
      parameters:
        - name: X-Operator-Id
          in: header
          required: true
          description: Operator identifier issued by Polarkast. Selects the shared secret used to verify `X-Signature`.
          schema: { type: string }
          example: op_demo
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GamesResponse' }
              examples:
                ok:
                  value:
                    games:
                      - game_id: four-star-dragons
                        version: 1
                        name: 4 Star Dragons
                        category: slots
                        rtp: 9399
                        modes:
                          - { mode: base, cost_x100: 100, rtp: 9399 }
                          - { mode: buy, cost_x100: 5000, rtp: 9399 }
                        enabled: true
                        platforms: [desktop, mobile]
                        stakes:
                          - { currency: EUR, precision: 2, min: 10, max: 1000000, bets: [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000] }
                        freebet_support: false
                        blocked_countries: []
                        thumbnails: ['https://polarkast.tech/four-star-dragons-card.webp']
                        release_date: '2026-11-26'
                        hit_rate: 2723
                        max_win_x100: 500000
                        features: [hold_and_win, buy]
                      - game_id: stub
                        version: 1
                        name: Stub
                        category: test
                        rtp: 9600
                        modes:
                          - { mode: base, cost_x100: 100, rtp: 9600 }
                        enabled: true
                        platforms: []
                        stakes:
                          - { currency: EUR, precision: 2, min: 10, max: 1000000 }
                        freebet_support: true
                        blocked_countries: [US]
                        thumbnails: []
                        release_date: '2026-11-25'
                        end_date: '2027-06-30'
                        hit_rate: 5000
                        max_win_x100: 1600
