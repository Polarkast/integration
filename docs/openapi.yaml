openapi: 3.1.0
info:
  title: Polarkast Game Provider API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Seamless-wallet API between Polarkast (the game studio) and an operator (the casino). This file is the single
    source of truth; where code, docs or tests disagree with it, they are wrong.

    Three tags:
    - `studio`: hosted by Polarkast. The operator calls it. `POST /v1/launch`, `POST /v1/round`, `GET /v1/games`
      (the game catalog), `POST /v1/rewards` and `POST /v1/rewards/cancel` (free rounds).
    - `wallet`: hosted by the operator at a base URL the operator configures with Polarkast. Polarkast calls it.
      Paths below are relative to that base URL (for example `https://wallet.operator.example` plus `/wallet/bet`).
    - `game`: hosted by Polarkast and called by the Polarkast game client, which `game_url` serves on the same
      origin. Not part of the operator contract: operators never call it. It is documented so the client's contract
      is written down and so a round can be played without the client, for example in the sandbox.

    ## Games
    Every `game_id` belongs to one of three families.
    - Weighted (`stub`, the sandbox's test game): a bet, then one outcome from the game's table.
    - Hold-and-win (`four-star-dragons`) and pay-anywhere (`nova-forge`): the player picks a play amount (`bet`) from
      the session's `bets` and a round `mode`. A `base` round costs the play amount. A `buy` round starts the game's
      feature at once and costs `ceil(bet * buyCost / 100)`. A pay-anywhere game also has `ante`: a base round with
      more scatters, costing `bet * anteCost / 100`, and offered only at play amounts where that is a whole number of
      minor units (with `anteCost` 125, a multiple of 4), so that the round's return is the game's at every play
      amount; `ante` at any other play amount is `INVALID_REQUEST`. `buyCost` and `anteCost` are in the game's
      display model (`/game/open`). The wallet bet's `amount` is the round's cost, and the operator's stake limits
      for the currency apply to it, not to the play amount. The round's win is a whole number of hundredths of the
      play amount (`script.win`), never above the game's `cap`; the wallet win's `amount` is
      `floor(bet * script.win / 100)`.

      Pay-anywhere: nothing carries from round to round. A spin pays wherever enough of one symbol lands on its 6 by
      5 board, and its wins tumble out: they go, the rest fall, new symbols drop in, and the board pays again; a spin
      pays at most `maxTumbles` times. Multiplier symbols multiply what a winning spin's tumbles paid. A base spin's
      scatters pay and, at least `triggerAt` of them, start free spins, in which every winning spin's multipliers add
      to one feature multiplier that only grows; a feature plays at most `maxFreeSpins` free spins.

      Hold-and-win: each player has four pots that carry from round to round. Polarkast keeps them per operator, player, game,
      currency and play amount, and they never expire. A base round reads and changes the pots of its play amount; a
      bought round neither reads nor changes any pots; a bet that fails or is rolled back leaves them as they were.
      The first time a player uses a play amount, its pots get a warm start: unpaid spins from empty pots, drawn once
      from the operator's RNG, so they stand where a long game typically stands. A warm start is recorded like a round
      and stored once; on a provably fair operator it uses the next nonce of the player's server seed.

    `GET /v1/games` lists the games for the calling operator: RTP per mode, the stakes each of its currencies allows,
    whether the game is enabled for it, and the display and retirement details an operator's lobby needs. A game
    that comes in several RTP variants lists each variant as its own `game_id` with its own RTP; enable the one you
    want.

    ## Free rounds
    An operator gives a player free rounds by creating a reward with `POST /v1/rewards`: the player, a currency and
    precision, the games, the number of rounds, the bet of each round and an expiry. The operator chooses the
    `reward_id`; it is unique per operator, and creating the same reward again is safe (see Idempotency).
    - The bet must be a valid stake for every game of the reward, in `GET /v1/games` terms: within the currency's
      `min` and `max` and, for a hold-and-win or pay-anywhere game, one of its `bets`. The stake limits are checked
      when the reward is created; a later change to them does not affect a reward that exists.
    - The player plays the rounds in any of the reward's games, in a session of that player, currency and precision,
      until `expires_at`. `/game/open` lists the session's usable rewards and the game client plays one free round by
      sending its `reward_id` to `/game/round`. A free round is a normal round at the reward's bet whose stake the
      operator funds: a `base` round, decided and recorded like any other, with no `/wallet/bet` call. Kill switches
      apply to it as to a paid round.
    - Each free round is written once to Polarkast's append-only log when it starts, and a reward never plays more than
      its `rounds`. Rounds a reward has not used are owed to the player until it expires; then they lapse.
    - Winnings are credited once per free round, never once per reward: when a free round has been played Polarkast
      sends one `/wallet/win` carrying the `reward_id`, with `amount` 0 for a round that won nothing, so the operator
      sees every round used. It is idempotent on its `transaction_id` and retried like every win (see Timeouts and
      retries), also after the reward expired or was used up: winnings of a round played before expiry always pay out.
    - `POST /v1/rewards/cancel` cancels a reward only before its first free round has started; after that it is
      refused and the reward stays.
    - Fun sessions have no free rounds.

    ## Fun mode
    `POST /v1/launch` with `mode: "fun"` (signed as always) launches a game with play money. It needs no player:
    `session_token` and `player_id` are ignored, and Polarkast makes no wallet call of any kind for the session. The
    launch's `currency` must be enabled for the operator; its precision, stake limits and symbol apply. The balance
    starts at 1000000 minor units of it. Fun rounds use the CSPRNG and are not recorded: they never reach the money
    log or `/v1/round`. A hold-and-win game's pots last for the session only, and start warm like a player's. A fun session never becomes a
    money session; launch again without `mode` for real play.
    A fun session ends 30 minutes after its last request (`/game/open` or a round), and a server restart may end it
    sooner; its `game_session_id` is then `INVALID_SESSION`. Rate limits: at most 600 fun launches a minute per
    operator, and at most 5 rounds a second per fun session. A request over a limit gets `RATE_LIMITED` (HTTP 429)
    and changes nothing; retry after a minute (launches) or a second (rounds).

    ## Limits
    - `/game/round` takes Polarkast under 20 ms at the 99th percentile, not counting the operator's wallet calls; each
      answer's `Server-Timing` header gives both. A
      round that has not settled within 10 seconds answers `INTERNAL_ERROR` ("still settling") and goes on settling in
      the background; send the same `request_id` again.
    - A hold-and-win `/game/round` response, script included, is at most 32 KiB. Typical sizes over 1,000,000 rounds
      of each mode: a base round 0.4 KiB (99% under 1 KiB, the largest 4.4 KiB), a bought round 1.4 KiB (99% under
      2.2 KiB, the largest 3 KiB).
    - A pay-anywhere `/game/round` response has no fixed bound short of the game's own (`maxTumbles` a spin,
      `maxFreeSpins` a feature), so a client accepts any size. Over 1,000,000 rounds of each mode, script included: a
      base or ante round 0.5 KiB (99% under 1.1 KiB, the largest seen about 17 KiB), a bought round 6 KiB (99% under
      10 KiB, the largest seen about 20 KiB); none reached 32 KiB.
    - Fun mode: the rate limits above.

    ## Transport
    - HTTPS only. Every request and response body is `application/json` (UTF-8). Every operation is `POST`, except
      `GET /v1/games`, whose request has no body.
    - Unknown request fields are ignored. Missing required fields, wrong types or out-of-range values are `INVALID_REQUEST`.
    - A successful call is HTTP 200 with the documented body. Any failure is an error body (see Errors).

    ## Money
    - An amount is an integer in minor units (`amount`), always with a `currency` and an integer `precision`
      (number of decimal places). Real value = `amount / 10^precision`. Example: `amount 1050`, `currency EUR`,
      `precision 2` is 10.50 EUR. Floats, decimals and strings are never used for money.
    - A JSON number is an integer only when written as an integer literal. `100.0` and `1e2` have an integer value
      but are not integer literals: for `amount` (and every other integer field, such as `precision`) they are
      `INVALID_REQUEST`, as are fractions, strings and `null`. Receivers must inspect the number as written, not
      the value a JSON parser returns.
    - `currency` is an opaque string, 1 to 16 characters from `A-Z0-9_` (for example `EUR`, `BTC`, `GC`, `SC`). Polarkast
      does not interpret it. Sweepstakes play coins and prize coins are simply two different currency codes; the API has
      no sweepstakes-specific fields.
    - Amounts are int64 and never exceed 2^53-1 (9007199254740991), so JSON numbers stay exact in every language.
      A value above that is `INVALID_REQUEST`.
    - A player session has exactly one currency and one precision, fixed by `/wallet/authenticate`. Every later money
      call must repeat that currency and precision exactly, otherwise `CURRENCY_MISMATCH`.

    ## Identifiers
    `transaction_id`, `round_id`, `player_id`, `game_id` and `session_token` are strings of 1 to 128 characters from
    `A-Za-z0-9_-.:`. Polarkast generates `transaction_id` and `round_id` (UUIDs); the operator generates `player_id`
    and `session_token`.

    ## Brand
    An operator that runs several brands behind one wallet URL registers them with Polarkast and sends the optional
    `brand` (an `Id`) in `/v1/launch`. Polarkast then sends the same `brand` on every wallet call of that session:
    `/wallet/authenticate`, `/wallet/balance`, `/wallet/bet`, `/wallet/win` and `/wallet/rollback` (a rollback carries
    its bet's brand). Without a brand the field is absent. `brand` is fixed per session, so Polarkast never changes it
    between retries of a call. It is not part of the idempotency body comparison: a repeated `transaction_id` is
    judged on the other fields, as before. An operator without brands can ignore the field.

    ## Signing (both directions, every request)
    Every request, from either side, carries the header `X-Signature`: the lowercase hex encoding (64 characters) of
    HMAC-SHA256 computed over the exact raw bytes of the HTTP request body, keyed with the per-operator shared secret
    (the secret's UTF-8 bytes, used as-is). Nothing else is signed: not the path, headers or query. The receiver
    computes the HMAC over the raw bytes it received (before any JSON parsing), compares it in constant time, and
    rejects a mismatch with `INVALID_SIGNATURE` before doing anything else. Responses are not signed.
    Requests to `/v1/launch`, `/v1/round`, `/v1/games`, `/v1/rewards` and `/v1/rewards/cancel` also carry
    `X-Operator-Id` (issued by Polarkast) so the secret can be found. `GET /v1/games` has no body, so its signature is
    the HMAC of zero bytes: the same value on every call, until the secret is rotated. It grants only that read.

    ## Idempotency
    Every money call (`bet`, `win`, `rollback`) is identified by its `transaction_id`, unique per operator across all
    three call types (one namespace).
    - The first call with an id is executed and its response stored.
    - Repeating a call with the same `transaction_id` and the same body returns the
      original response (same HTTP status, same body, so the same `balance` as originally returned) and moves no money.
      This holds for every definitive error response too (for example `INVALID_SESSION`, `INSUFFICIENT_FUNDS`,
      `CURRENCY_MISMATCH`): it is stored and replayed unchanged, even if the
      balance or session has changed since. Only `INTERNAL_ERROR` is never stored.
    - "The same body" compares exactly the fields this spec defines for that call (its schema in `components`), by
      value. Fields the spec does not define are ignored, so a different or extra unknown field never makes two
      bodies differ, and key order or whitespace does not matter.
    - What is stored: the response to a well-formed request, that is one with a valid signature that passes field
      validation (a well-formed `transaction_id` and every required field present, typed and in range). That is
      the success or the definitive error decided by business rules (`INVALID_SESSION`, `INSUFFICIENT_FUNDS`,
      `CURRENCY_MISMATCH`, `INVALID_REQUEST` for an unknown `player_id`, and so on). A malformed request is never
      stored and does not use up its `transaction_id`: `INVALID_SIGNATURE`, and `INVALID_REQUEST` for bad JSON, a
      missing, mistyped or out-of-range field or a non-integer number. `TRANSACTION_MISMATCH` and
      `TRANSACTION_ROLLED_BACK` are answers about the id, not stored responses; they never replace one.
    - The same `transaction_id` with any field different, or used by a different call type, returns `TRANSACTION_MISMATCH`
      and moves no money.
    - Rollback references the bet's `transaction_id` in `bet_transaction_id`. A rollback for a bet the operator has never
      seen succeeds, moves no money, and is recorded; a bet arriving later with that id is rejected with
      `TRANSACTION_ROLLED_BACK`. A bet that was rolled back stays rolled back: replaying it, even with the same
      body, returns `TRANSACTION_ROLLED_BACK` and not the stored response. Order of evaluation for a known or
      rolled-back id: `TRANSACTION_MISMATCH` first, then `TRANSACTION_ROLLED_BACK`, then the stored response.
    - A rollback of a bet that was refused (a definitive bet error such as `INSUFFICIENT_FUNDS`, so it never debited)
      is like a rollback of a bet never seen: HTTP 200, no money moves, and the bet id is recorded as rolled back.
      Replaying that bet then returns `TRANSACTION_ROLLED_BACK`, not its stored error.
    - A rollback whose `bet_transaction_id` is the id of a `win` or of a `rollback` is `TRANSACTION_MISMATCH`
      (HTTP 409): that id is already used by a different call type, which is the case the one-namespace rule
      names, and no existing code fits better (`INVALID_REQUEST` is for a malformed request, and this one is
      well-formed). Nothing moves and the id is not recorded as rolled back. Being a definitive error on a
      well-formed request, it is stored and replayed like any other.
    - Rewards: `POST /v1/rewards` is idempotent on `reward_id`, a namespace of its own per operator. The first call
      creates the reward. Repeating it with the same body creates nothing and returns the reward as it stands now
      (its `status`, `rounds_used` and `win` may have moved on). "The same body" compares the fields of
      `RewardRequest` by value, `game_ids` as a set (order and repeats do not matter) and `expires_at` as an instant.
      The same `reward_id` with any of them different is `TRANSACTION_MISMATCH`. A create that is refused creates
      nothing and does not use up its `reward_id`.

    ## Win and rollback checks (session, player)
    `win` and `rollback` never check the session token for validity or expiry: an unknown, expired or other player's
    token is accepted, and `INVALID_SESSION` is never returned for them. The token must still be a well-formed `Id`
    (a malformed one is `INVALID_REQUEST`). What is checked instead:
    - An unknown `player_id` is `INVALID_REQUEST` (HTTP 400); nothing moves.
    - A `rollback` whose `bet_transaction_id` is a bet of another player is `INVALID_REQUEST` (HTTP 400); nothing
      moves and the bet is not marked rolled back.

    `bet` does check the token: it must be valid now and be the token of `player_id`. A valid token that belongs to
    another player is `INVALID_SESSION` (HTTP 403), like an unknown one.

    ## Timeouts and retries (Polarkast as caller)
    - Request timeout: 5 seconds per attempt (connect plus response). Operators should answer in under 2 seconds.
    - Retryable failures: a timeout, a connection error, HTTP 502, 503 or 504, or an error body with code
      `INTERNAL_ERROR`. Everything else is definitive and is never retried.
    - `/wallet/authenticate` and `/wallet/balance` are not retried; the failure is returned to the caller.
    - `/wallet/bet` is never retried. On a retryable failure Polarkast treats the bet as unknown and sends
      `/wallet/rollback` for it, then ends the round without play. A definitive error (for example
      `INSUFFICIENT_FUNDS`) needs no rollback.
    - `/wallet/win` and `/wallet/rollback` are retried with the same `transaction_id` and the same body until a
      definitive response (HTTP 200 or a non-retryable error). Backoff: wait 1, 2, 4, 8, 16 seconds, then 30 seconds
      between attempts, for up to 24 hours; after that the transaction is flagged for manual reconciliation. The
      operator must keep accepting `win` and `rollback` for a round even after the session token expired or the
      player disconnected.
    - A late duplicate is harmless because of the idempotency rule; operators must make it so.

    ## Errors
    Every failure, on every endpoint, has the same body: `{"error": {"code": "...", "message": "..."}}` with a code
    from the closed list in `ErrorCode`. `message` is for humans and may change; code and HTTP status are the contract.
  contact:
    name: Polarkast integrations
    url: https://github.com/Polarkast/integration
servers:
  - url: https://sandbox.polarkast.tech
    description: Hosted sandbox studio. Used by `studio` and `game` operations. Production gets its own URL, issued with production credentials.
  - url: https://wallet.operator.example
    description: Operator wallet (placeholder host; the real base URL is the operator's own, registered with Polarkast). Used by `wallet` operations only.
security:
  - HmacSignature: []
tags:
  - name: studio
    description: Hosted by Polarkast; called by the operator. `launch` and `round`.
  - name: wallet
    description: Hosted by the operator; called by Polarkast.
  - name: game
    description: Called by the Polarkast game client from the page `game_url` serves; not part of the operator contract. Not signed; the launch token, then the `game_session_id` it opens, is the credential. In the sandbox, use it to play a round without the client.
paths:
  /v1/launch:
    post:
      tags: [studio]
      operationId: launch
      summary: Get a game URL for a player session
      description: |
        Called by the operator when a player opens a game. Requires `X-Operator-Id` and `X-Signature`.
        Polarkast calls the operator's `/wallet/authenticate` with the `session_token`; if that fails, the wallet's
        error code is returned here with the same HTTP status (a wallet timeout or retryable failure becomes
        `INTERNAL_ERROR` 503). If the `currency` differs from the one `authenticate` returned, the result is
        `CURRENCY_MISMATCH`. An unknown `game_id` is `INVALID_REQUEST`. Polarkast configures per operator which games and
        which currencies (with precision and stake limits) are enabled: a game that is not enabled for the operator or
        is switched off, a game blocked in the request's `country`, a `brand` the operator has not registered, or a
        session currency and precision the operator has no settings for, is `NOT_AVAILABLE`;
        a suspended operator gets `OPERATOR_SUSPENDED` (checked before the wallet is called, as are the brand and the
        country, except the currency, which is checked after `authenticate` returns it). On success the operator redirects or embeds the
        player at `game_url`. The URL is single-use for the player and valid for 5 minutes.
        With `mode: "fun"` (see Fun mode) the same checks run except the wallet's: Polarkast does not call
        `/wallet/authenticate`, and the `currency` must be enabled for the operator (otherwise `NOT_AVAILABLE`).
        More than the fun launch rate limit is `RATE_LIMITED`.
      parameters:
        - name: X-Operator-Id
          in: header
          required: true
          description: Operator identifier issued by Polarkast. Selects the shared secret used to verify `X-Signature`.
          schema: { type: string }
          example: op_demo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LaunchRequest' }
            examples:
              ok:
                value:
                  session_token: sess_8f3a
                  player_id: player-42
                  game_id: stub
                  currency: EUR
                  language: en
              with_context:
                value:
                  session_token: sess_8f3a
                  player_id: player-42
                  game_id: stub
                  currency: EUR
                  language: en
                  brand: brand_north
                  country: SE
                  lobby_url: https://casino.example/lobby
              fun:
                value:
                  mode: fun
                  game_id: four-star-dragons
                  currency: EUR
                  language: en
                  lobby_url: https://casino.example/lobby
      responses:
        '200':
          description: Game URL created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaunchResponse' }
              examples:
                ok:
                  value: { game_url: 'https://play.polarkast.example/g/stub?t=lt_5c1e9d' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidSignature' }
        '403': { $ref: '#/components/responses/LaunchForbidden' }
        '422': { $ref: '#/components/responses/CurrencyMismatch' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/InternalError' }
  /v1/round:
    post:
      tags: [studio]
      operationId: round
      summary: Look up a round and get a short-lived round page URL
      description: |
        Called by the operator, for example from a back office or for reconciliation. Requires `X-Operator-Id` and
        `X-Signature`, verified before the body is parsed. Send exactly one of `round_id` or `transaction_id`
        (both, or neither, is `INVALID_REQUEST`); a `transaction_id` is resolved to the round it belongs to. A round or
        transaction that does not exist, or that belongs to another operator, is the same `INVALID_REQUEST` with the
        same message: an operator can read only its own rounds.
        The response lists every transaction of the round in the order Polarkast logged it, each with the status
        Polarkast holds for it, and `round_url`, a link to an HTML page for the round. The link is valid for 15 minutes
        (`expires_at`) and may be opened any number of times within that time, for example by an embedded frame that
        reloads; after it expires it answers 404. Call again for a new link. The link itself is the credential: do not
        log or share it. The page is a plain GET, not an API operation: it shows the game and version, the time, every
        bet, win and rollback with amount and status, the outcome and multiplier, and, when the round used provably fair
        play, the commitment, client seed, nonce and draws. The server seed appears only once it has been revealed
        by a seed rotation. Neither the response nor the page ever contains session tokens, signatures, the operator's
        raw requests or responses, or a server seed that is not yet revealed.
        A hold-and-win round also has `hold_and_win`: its mode, play amount, the amount debited, the win split and
        the pots before and after. Its page shows the same, the round's key moments (the hold-and-win feature
        triggered, a pot filled, the board opened) and how to replay it: the draws, in the order they were used, with
        the pots before, reproduce the round and the pots after on the game and engine versions the page names; on a
        provably fair round, the revealed server seed, the client seed and the nonce reproduce the draws.
        A pay-anywhere round has `pay_anywhere` instead: its mode, play amount, the amount debited and the win split
        between the base spin and the free spins. Its page shows the same, the round's key moments (free spins
        started, free spins added, the cap reached) and how to replay it: the draws, in the order they were used,
        reproduce the round on the game and engine versions the page names; on a provably fair round, the revealed
        server seed, the client seed and the nonce reproduce the draws. Fun rounds are not recorded and are never
        found. A free round (see Free rounds) has `reward_id`, no bet transaction, only its win, and a `cost` of 0.
      parameters:
        - name: X-Operator-Id
          in: header
          required: true
          description: Operator identifier issued by Polarkast. Selects the shared secret used to verify `X-Signature`.
          schema: { type: string }
          example: op_demo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoundLookupRequest' }
            examples:
              by_round: { value: { round_id: 5b1d3c7e-2a64-4f08-8c19-7e3a9d4b6f21 } }
              by_transaction: { value: { transaction_id: 0c9a6e1b-73d2-4c58-9d0e-3f5b8a21c4e7 } }
      responses:
        '200':
          description: Round found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundLookupResponse' }
              examples:
                settled:
                  value:
                    round_id: 5b1d3c7e-2a64-4f08-8c19-7e3a9d4b6f21
                    game_id: stub
                    round_url: 'https://play.polarkast.example/rounds/rt_2f6c0d9e4b7a4e1c8a35d1b7f0c9e642'
                    expires_at: '2026-01-15T10:15:00.000Z'
                    transactions:
                      - { transaction_id: 0c9a6e1b-73d2-4c58-9d0e-3f5b8a21c4e7, kind: bet, amount: 100, currency: EUR, precision: 2, status: succeeded, created_at: '2026-01-15T10:00:00.120Z' }
                      - { transaction_id: 9d41b7a0-5e3c-4f62-8b1a-6c0e2d7f9a35, kind: win, amount: 200, currency: EUR, precision: 2, status: succeeded, created_at: '2026-01-15T10:00:00.310Z' }
                hold_and_win:
                  value:
                    round_id: 7a2e9c14-3b6d-4f80-9e15-2c4d6b8a0f37
                    game_id: four-star-dragons
                    round_url: 'https://play.polarkast.example/rounds/rt_9b3e1f0c7d2a4e5b8c6f1a0d3e7b9c24'
                    expires_at: '2026-01-15T10:15:00.000Z'
                    transactions:
                      - { transaction_id: 3e8b0d27-9f41-4c6a-8d52-1b7e0a9c3f68, kind: bet, amount: 100, currency: EUR, precision: 2, status: succeeded, created_at: '2026-01-15T10:00:00.120Z' }
                      - { transaction_id: 5c1f7a93-2d08-4e6b-9a34-8f0b2e6d1c75, kind: win, amount: 150, currency: EUR, precision: 2, status: succeeded, created_at: '2026-01-15T10:00:00.290Z' }
                    hold_and_win:
                      mode: base
                      bet: 100
                      cost: 100
                      win_x100: { lines: 150, collect: 0, bonus: 0 }
                      pots_before: [12, 29, 4, 21]
                      pots_after: [13, 29, 4, 21]
                pay_anywhere:
                  value:
                    round_id: 1f6a3d80-9c2e-4b57-a1d4-6e0b8c3f2a95
                    game_id: nova-forge
