                      - { transaction_id: 2e7c9a51-6b0d-4f38-8c1e-5d9a3b7f0e42, kind: win, amount: 9400, currency: EUR, precision: 2, status: succeeded, created_at: '2026-01-15T10:00:00.290Z' }
